name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Static Web Bundle in dist/
        run: |
          mkdir -p dist
          cp -r index.html public src dist/
          sed -i 's|"webDir": "."|"webDir": "dist"|g' capacitor.config.json

      - name: Install Capacitor & Generate Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/screen-orientation @capacitor/haptics @capacitor/preferences
          npx cap add android
          npx cap sync android

      - name: Compile Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalaNusantara-Majapahit-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
