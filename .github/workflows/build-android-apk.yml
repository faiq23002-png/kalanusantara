name: Build Android APK (Capacitor)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Static Web Bundle in dist/
        run: |
          mkdir -p dist
          cp -r index.html public src dist/

      - name: Install Dependencies
        run: |
          npm install

      - name: Add Android & Sync Assets
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Compile Debug APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KalaNusantara-Majapahit-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
